spring.application.name=fixmate-backend
server.port=${SERVER_PORT:8080}

# =========================
# DATABASE
# =========================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fixmate_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=20000


# =========================
# JPA
# =========================

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# =========================
# JWT
# =========================

fixmate.jwt.secret=${JWT_SECRET}
fixmate.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}


# =========================
# ADMIN
# =========================

fixmate.admin.email=${ADMIN_EMAIL:admin@fixmate.com}
fixmate.admin.password=${ADMIN_PASSWORD}
fixmate.admin.phone=${ADMIN_PHONE:9999999999}
fixmate.admin.seed-enabled=${ADMIN_SEED_ENABLED:false}


# =========================
# CORS
# =========================

fixmate.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}


# =========================
# ACTUATOR
# =========================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never


# =========================
# LOGGING
# =========================

logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.fixmate=${FIXMATE_LOG_LEVEL:INFO}